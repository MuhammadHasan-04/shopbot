# Render Blueprint: creates the Postgres database, the ShopBot Agent API and the website, all connected.
# Render -> New -> Blueprint -> pick this repo. You only type ANTHROPIC_API_KEY and ADMIN_TOKEN.
databases:
  - name: shopbot-db
    plan: free
    region: singapore
    databaseName: shopbot
    user: shopbot

services:
  - type: web
    name: shopbot-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: shopbot-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: shopbot
      - key: CORS_ORIGINS
        value: "*"

  # The website (customer store + seller dashboard) as a free Static Site. It never sleeps.
  # NEXT_PUBLIC_AGENT_HOST is filled automatically with the API's address.
  - type: web
    name: shopbot-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_AGENT_HOST
        fromService:
          type: web
          name: shopbot-agent
          property: host
